<title>Toronto Tech Events</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one reading column; sticky filter bar; events grouped by day under week headings */
:root{
  --bg:#f6f7f8; --surface:#ffffff; --fg:#17191c; --muted:#5d6570; --line:#dfe3e8;
  --accent:#d6252f; /* TTC red */ --accent-soft:#fbe9ea; --chip:#eceff2; --pick:#0f7a4f; --pick-soft:#e3f4ec;
  --display:"Archivo",system-ui,sans-serif; --body:"Source Sans 3",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#1a1d21; --fg:#eceef1; --muted:#9aa3ad; --line:#2b3036;
  --accent:#ff5a63; --accent-soft:#3a1d20; --chip:#24282d; --pick:#46c88f; --pick-soft:#173328; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1a1d21; --fg:#eceef1; --muted:#9aa3ad; --line:#2b3036;
  --accent:#ff5a63; --accent-soft:#3a1d20; --chip:#24282d; --pick:#46c88f; --pick-soft:#173328; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
header h1{font:800 clamp(28px,6vw,40px)/1.05 var(--display);letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
header h1 span{color:var(--accent)}
header p{color:var(--muted);margin:0;max-width:62ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);margin-top:18px;display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .lbl{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:4px;min-width:62px}
button.chip{font:600 14px var(--body);border:1px solid transparent;background:var(--chip);color:var(--fg);padding:5px 11px;border-radius:999px;cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
button.chip.pick[aria-pressed="true"]{background:var(--pick);color:#fff}
button.chip:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input#q{flex:1;min-width:0;font:16px var(--body);padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.count{font:500 13px var(--mono);color:var(--muted);white-space:nowrap}
h2.week{font:800 13px var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:30px 0 4px}
h3.day{font:700 18px var(--display);margin:18px 0 8px;display:flex;gap:10px;align-items:baseline}
h3.day small{font:500 12px var(--mono);color:var(--muted)}
.ev{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.time{font:500 13px var(--mono);color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.main{min-width:0}
.name{font:600 17px/1.3 var(--body);color:var(--fg);text-decoration:none}
.name:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.meta{color:var(--muted);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.why{font-size:15px;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:4px;background:var(--chip);color:var(--muted)}
.tag.pick{background:var(--pick-soft);color:var(--pick)}
.tag.flag{background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);padding:40px 0;text-align:center}
@media (max-width:520px){.ev{grid-template-columns:1fr;gap:2px}.row .lbl{min-width:0;width:100%}}
</style>
<div class="wrap">
<header>
  <h1>Toronto Tech Events <span>__RANGE__</span></h1>
  <p>__COUNT__ in-person GTA tech events from Luma, Eventbrite, Meetup and a few hand-checked sites, de-duplicated. Green "Pick" marks events worth going to for an AI product and marketing lead. Updated __UPDATED__.</p>
</header>
<div class="bar">
  <div class="row"><span class="lbl">Week</span><span id="weeks" class="row"></span></div>
  <div class="row"><span class="lbl">Topic</span><span id="cats" class="row"></span></div>
  <div class="row"><button class="chip pick" id="picks" aria-pressed="false">Picks only</button><input id="q" type="search" placeholder="Search name, host, venue" aria-label="Search events"><span class="count" id="count"></span></div>
</div>
<main id="list"></main>
</div>
<script>
const EVENTS = __DATA__;
const CATS = {AI:"AI",startups:"Startups",VC:"VC",dev:"Dev",product:"Product & GTM",data:"Data",design:"Design","other-tech":"Other tech"};
const state = {week:"all", cat:"all", picks:false, q:""};
const toD = s => new Date(s+"T12:00:00Z");
const monday = s => { const d=toD(s); d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)); return d.toISOString().slice(0,10); };
const fmt = (s,o) => new Intl.DateTimeFormat("en-US",Object.assign({timeZone:"UTC"},o)).format(toD(s));
const weekLabel = m => { const e=new Date(toD(m)); e.setUTCDate(e.getUTCDate()+6); const es=e.toISOString().slice(0,10); return fmt(m,{month:"short",day:"numeric"})+" – "+fmt(es,es.slice(5,7)===m.slice(5,7)?{day:"numeric"}:{month:"short",day:"numeric"}); };
const mins = t => { const m=/(\d+):(\d+)\s*(AM|PM)/i.exec(t||""); if(!m) return 0; let h=+m[1]%12; if(m[3].toUpperCase()==="PM") h+=12; return h*60+ +m[2]; };
EVENTS.sort((a,b)=>a.d.localeCompare(b.d)||mins(a.t)-mins(b.t));
const weeks=[...new Set(EVENTS.map(e=>monday(e.d)))];
function chip(parent,label,val,key){ const b=document.createElement("button"); b.className="chip"; b.textContent=label; b.dataset.val=val; b.setAttribute("aria-pressed",String(state[key]===val)); b.onclick=()=>{state[key]=val; parent.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.val===val))); save(); render();}; parent.appendChild(b); }
function save(){ try{localStorage.setItem("tte-filters",JSON.stringify(state));}catch(e){} }
try{ Object.assign(state, JSON.parse(localStorage.getItem("tte-filters")||"{}")); }catch(e){}
const W=document.getElementById("weeks"), C=document.getElementById("cats");
chip(W,"All","all","week"); weeks.forEach(w=>chip(W,weekLabel(w),w,"week"));
chip(C,"All","all","cat"); Object.entries(CATS).forEach(([k,v])=>{ if(EVENTS.some(e=>e.c===k)) chip(C,v,k,"cat"); });
const P=document.getElementById("picks"); P.setAttribute("aria-pressed",String(state.picks)); P.onclick=()=>{state.picks=!state.picks; P.setAttribute("aria-pressed",String(state.picks)); save(); render();};
const Q=document.getElementById("q"); Q.value=state.q||""; Q.oninput=()=>{state.q=Q.value; save(); render();};
const FLAGS=[[/sold out/i,"Sold out"],[/approval required|invite[- ]only|ticket request/i,"Approval / invite"]];
function el(tag,cls,text){ const n=document.createElement(tag); if(cls) n.className=cls; if(text!=null) n.textContent=text; return n; }
function render(){
  const q=state.q.trim().toLowerCase();
  const list=EVENTS.filter(e=>(state.week==="all"||monday(e.d)===state.week)&&(state.cat==="all"||e.c===state.cat)&&(!state.picks||e.w)&&(!q||[e.n,e.v,e.x,e.y,e.s].join(" ").toLowerCase().includes(q)));
  document.getElementById("count").textContent=list.length+" of "+EVENTS.length;
  const root=document.getElementById("list"); root.textContent="";
  if(!list.length){ root.appendChild(el("p","empty","No events match these filters. Try another week or clear the search.")); return; }
  let wk="", day="", box=null;
  for(const e of list){
    const m=monday(e.d);
    if(m!==wk){ wk=m; root.appendChild(el("h2","week","Week of "+weekLabel(m))); day=""; }
    if(e.d!==day){ day=e.d; const h=el("h3","day",fmt(e.d,{weekday:"long",month:"short",day:"numeric"})); const n=list.filter(x=>x.d===e.d).length; h.appendChild(el("small",null,n+(n===1?" event":" events"))); root.appendChild(h); box=el("div","dayblock"); root.appendChild(box); }
    const row=el("article","ev"); row.appendChild(el("div","time",e.t||""));
    const main=el("div","main"); const a=el("a","name",e.n); a.href=e.u; a.target="_blank"; a.rel="noopener"; main.appendChild(a);
    const meta=[e.v, e.p, e.x?e.x.split(/,\s*/).map(h=>"@"+h).join(" "):""].filter(Boolean).join(" · ");
    if(meta) main.appendChild(el("div","meta",meta));
    if(e.y) main.appendChild(el("div","why",e.y));
    const tags=el("div","tags"); if(e.w) tags.appendChild(el("span","tag pick","Pick"));
    if(CATS[e.c]) tags.appendChild(el("span","tag",CATS[e.c]));
    FLAGS.forEach(([rx,l])=>{ if(rx.test(e.y)||rx.test(e.v)) tags.appendChild(el("span","tag flag",l)); });
    tags.appendChild(el("span","tag",e.s)); main.appendChild(tags);
    row.appendChild(main); box.appendChild(row);
  }
}
render();
</script>
